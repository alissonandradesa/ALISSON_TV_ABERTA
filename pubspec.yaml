name: alisson_tv_aberta
description: "App de TV aberta para TV Box MaxQ Pro 4K"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.1"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # Como o foco é Android/TV Box, desativamos o iOS
  image_path: "assets/icon.png" # Caminho onde você salvou a sua imagem
  min_sdk_android: 21